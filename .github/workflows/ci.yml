name: monorepo checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:tooling
      - run: npm run audit:public -- --history
      - run: npm run bootstrap
      - run: npm run build:pi
      - run: npm test
      - run: npm run check:web
